name: Update APT repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip xz-utils zstd bzip2 gnupg

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sync releases and rebuild indexes
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          printf '%s' "$APT_GPG_PASSPHRASE" > /tmp/apt-passphrase
          chmod 600 /tmp/apt-passphrase
          APT_GPG_PASSPHRASE_FILE=/tmp/apt-passphrase ./scripts/sync-releases.sh

      - name: Commit updated repository
        run: |
          git config user.name "burc334"
          git config user.email "burc334@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi
          git commit -m "Update APT indexes"
          git push
